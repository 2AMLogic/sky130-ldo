name: CI

# Self-check inventory for this repo (see sim/README.md, layout/README.md,
# CLAUDE.md) and where each one runs:
#
#   - `package.json` `check:ci` (JSON syntax of every root-level *.json plus
#     every sim/**/experiment.json, sim/**/records/*.json and
#     signoff/**/*.json, shell/python syntax of the harness scripts,
#     py_compile over every tracked sim/ + layout/ Python file,
#     `sim/tests/`'s PDK-free unit coverage for the corner runner's own pure
#     helper functions, a regex lint over tracked `.sch`/`.sym` files for
#     xschem's embedded-quoted-attribute truncation hazard (#59), a regex
#     lint over tracked `design/*.sch` files for duplicate component
#     `name=` values (#38) -- catches an unusable merged netlist, e.g. two
#     `M_ENP4` instances, without needing xschem/ngspice/the PDK at all --
#     and a uniqueness lint over tracked `spec/decision-records/DR-NNN-*.md`
#     filenames (#140), which catches two parallel branches independently
#     claiming the same DR number, as four open PRs each did with `DR-008`)
#     -> `checks` job below, every push/PR. Headless, no PDK, no `klt`
#     install needed.
#   - `signoff/check.sh` (re-grades this block's T1 state from
#     signoff/block-manifest.json via `klt signoff --manifest`, and fails if a
#     pinned content_hash no longer matches the artifact it covers or if the
#     committed signoff/records/t1-tier-report.json no longer matches a fresh
#     run) -> `signoff-tier-report` job below, every push/PR. Needs `klt` but
#     NOT the PDK/KLayout/ngspice: --manifest mode only reads committed JSON
#     envelopes and the tier doc bundled inside the klt wheel. See
#     signoff/README.md.
#   - `sim/selftest.sh --quick` (the harness's own liveness test: proves the
#     pinned sky130 PDK models load in ngspice, xschem netlists headlessly,
#     and the PVT knobs actually reach the simulator) -> requires xschem +
#     ngspice + the ~1 GB sky130 PDK via volare, so per this repo's
#     "headless only" default-CI guideline it does NOT block every PR. It
#     runs in the `pdk-smoke` job on a nightly schedule, on manual dispatch,
#     and opt-in on a PR via the `run-pdk-smoke` label. `--no-write` (the
#     default when `--record` is not passed) means it does not mint new
#     append-only sim/ evidence on every CI run.
#   - `layout/bin/run-trivial-cell-flow.sh` (the klt-driven DRC/LVS proof on
#     a trivial known-good cell -- see layout/README.md) needs a `klt`
#     install (layout/bin/setup-venv.sh) plus the same PDK as above, so it
#     is not wired into CI at all yet: it is proven by hand per
#     layout/README.md's quick start, and its checked-in
#     trivial-cell/reports/<record-id>/record.md is the evidence. Wiring it
#     into a CI job is a natural follow-up once this flow is exercised
#     enough to be worth the ~1 GB PDK download in a second job.
#   - Everything else claimed under `sim/<experiment>/` once real LDO
#     testbenches exist is evidence captured by a human/agent run of the
#     same PDK-gated runner, not a repeatable CI check -- re-running them
#     here would mint new append-only records on every push, which is not
#     what CI is for. See sim/README.md for how to reproduce a claim by hand.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # 06:00 UTC daily
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  checks:
    name: Repo checks (headless, no PDK)
    # Route to the shared self-hosted fleet runner (2am#29) for same-repo
    # events, falling back to ubuntu-latest for fork PRs — untrusted fork code
    # must never execute on a self-hosted runner. Mirrors the expression in
    # 2AMLogic/klayout-tools#1246.
    #
    # This is not a speed change: GitHub-hosted minutes are billed for PRIVATE
    # repos, and this org's Actions billing is currently blocked ("The job was
    # not started because recent account payments have failed…", see #51). Every
    # run in this repo has failed at startup since 2026-08-20 while public
    # sibling repos — billed differently — stayed green. Self-hosted minutes are
    # not billed, so this restores CI here independently of the billing fix.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","heavy"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: npm run check:ci
        run: npm run check:ci

  signoff-tier-report:
    name: T1 tier report (klt signoff --manifest, no PDK)
    # Same runner expression as `checks` above, and for the same reason (#51):
    # GitHub-hosted minutes are billed for private repos and this org's Actions
    # billing is blocked, so a self-hosted runner is what actually runs for
    # same-repo events; fork PRs fall back to ubuntu-latest and must never
    # execute on the self-hosted pool.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","heavy"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv (fetches the pinned klt release for signoff/check.sh)
        run: python3 -m pip install --upgrade uv

      - name: Re-grade this block's T1 state
        run: bash signoff/check.sh
        # signoff/records/t1-tier-report.json is the verdict of record that
        # issue #114 (the gap-to-T1 tracker) cites instead of keeping its own
        # hand-maintained item checklist. It is only worth citing if it cannot
        # rot: this step re-hashes every artifact behind every citation, then
        # re-runs `klt signoff --manifest` and fails when the committed record
        # no longer matches a fresh run. Both are real news -- either this
        # block's evidence moved, or the T1 checklist did (it grew an eleventh
        # item on 2026-09-17, klayout-tools#2025, which invalidated every
        # hand-read that predates it). See signoff/README.md, and check.sh's
        # header for why the klt release is pinned there and why that pin is
        # deliberately NOT layout/requirements.txt's klt pin.

  pdk-smoke:
    name: PDK-gated harness smoke test (nightly / workflow_dispatch / 'run-pdk-smoke' label)
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'run-pdk-smoke'))
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ngspice + xschem
        run: |
          sudo apt-get update
          sudo apt-get install -y ngspice xschem

      - name: Install volare
        run: pip install --user volare

      - name: Fetch + enable pinned sky130 PDK
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          commit="$(python3 -c "import json;print(json.load(open('sim/pdk.json'))['open_pdks_commit'])")"
          volare fetch --pdk sky130 "$commit"
          volare enable --pdk sky130 "$commit"

      - name: Run sim/selftest.sh --quick --require-pdk
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          sim/selftest.sh --quick --require-pdk
