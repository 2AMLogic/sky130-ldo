name: CI

# The headless `checks` job below runs `npm run check:ci`; package.json's
# `check:ci` chain is the authoritative inventory of what it covers -- not
# restated here, because an unchecked prose paraphrase of it drifts (#591).
# What package.json cannot express is why the PDK-dependent work does not
# block every PR:
#
#   - PDK smoke (.github/workflows/pdk-smoke.yml, called by the `pdk-smoke`
#     job below) runs only nightly, on manual dispatch, or on a PR opting in
#     with the `run-pdk-smoke` label: every PR would mean installing ngspice
#     + xschem and downloading the ~1 GB sky130 PDK (ciel) each time.
#   - `layout/bin/run-trivial-cell-flow.sh` (the klt-driven trivial-cell
#     DRC/LVS proof) is run by hand per layout/README.md's quick start --
#     evidence: trivial-cell/reports/<record-id>/record.md -- because a CI
#     job for it would need `klt` plus the same PDK.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    # No `labeled` (#707): every Loom label write on a PR used to re-run this
    # whole workflow against an unchanged tree. The one label that must start
    # something -- `run-pdk-smoke` -- is served by pdk-smoke.yml's own
    # `pull_request: labeled` trigger instead.
  merge_group:
    types: [checks_requested]
  schedule:
    # 06:00 UTC daily
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  checks:
    name: Repo checks (headless, no PDK)
    # GitHub-hosted for every event (2AMLogic/2am#3182): this repo is public,
    # so hosted minutes are free, and the shared self-hosted runner is retired.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Load-bearing, not a nicety (#220). `check:characterization` (inside
          # `check:ci`) re-generates measurements/characterization.md in
          # memory to compare against the committed file, and that report's
          # layout Freshness column resolves the schematic's last-touching
          # commit with `git log -1 -- design/ldo_3v3in_1v8out.sch`. On the
          # default depth-1 checkout the grafted tip commit has no parents, so
          # git reports IT as the last-touching commit of every file -- the
          # report comes out `STALE` and the check fails on a healthy tree.
          # Verified by running the check inside a `git clone --depth 1`.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv (runs the pinned ruff lint, test:lint-py)
        # `check:ci` -> `test` -> `test:lint-py` shells out to
        # `uvx --from ruff==0.17.0`, so this job needs uv/uvx on PATH (#293).
        # uv itself is pinned too, so the lint toolchain is reproducible end
        # to end rather than tracking whatever uv release is newest.
        run: python3 -m pip install "uv==0.12.23"

      - name: Verify the ratified spec table matches its lock (+ authorization diff on PR / merge group)
        # Merge queue (#668; event/base plumbing pattern from
        # sky130-comparator#332): on `merge_group` the checkout is the queue's
        # trial-merge commit and the base arrives in the event payload. The
        # event -> base selection lives in this shell (values through `env:`,
        # never `${{ }}` interpolated into the command), and an event that
        # requires a base but carries none FAILS rather than silently
        # downgrading to the current-tree check. Tests:
        # measurements/tests/test_check_spec_table.py (#618, merge-group cases).
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          BASE=""
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE"
          elif [ "$GITHUB_EVENT_NAME" = "merge_group" ]; then
            BASE="$MG_BASE"
          fi
          case "$GITHUB_EVENT_NAME" in
            pull_request|merge_group)
              [ -n "$BASE" ] || {
                echo "FAIL: $GITHUB_EVENT_NAME event carries no base sha: refusing to claim the spec table was verified" >&2
                exit 1
              } ;;
          esac
          if [ -n "$BASE" ]; then
            # The checkout is GitHub's merge commit (PR) or trial merge
            # (merge_group): the candidate being validated, compared against
            # the merge-base with the event's base SHA (full history from
            # fetch-depth: 0). Structural audit trail only; it is not
            # operator ratification.
            python3 spec/check_spec_table.py --check --base "$BASE"
          else
            # Push/schedule/manual: README's Parameter/Target/Stretch mirror
            # and its ratified notes vs spec/spec-table-lock.json consistency
            # (#618).
            python3 spec/check_spec_table.py --check
          fi

      - name: npm run check:ci
        run: npm run check:ci

  signoff-tier-report:
    name: T1 tier report (klt signoff --manifest, no PDK)
    # GitHub-hosted for every event (2AMLogic/2am#3182): this repo is public,
    # so hosted minutes are free, and the shared self-hosted runner is retired.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv (fetches the pinned klt release for signoff/check.sh)
        run: python3 -m pip install --upgrade uv

      - name: Re-grade this block's T1 state
        run: bash signoff/check.sh
        # signoff/records/t1-tier-report.json is the verdict of record that
        # issue #114 (the gap-to-T1 tracker) cites instead of keeping its own
        # hand-maintained item checklist. It is only worth citing if it cannot
        # rot: this step re-verifies each artifact behind every citation
        # (re-hash, or the committed store manifest digest), then
        # re-runs `klt signoff --manifest` and fails when the committed record
        # no longer matches a fresh run. Both are real news -- either this
        # block's evidence moved, or the T1 checklist did (it grew an eleventh
        # item on 2026-09-17, klayout-tools#2025, which invalidated every
        # hand-read that predates it). See signoff/README.md, and check.sh's
        # header for why the klt release is pinned there and why that pin is
        # deliberately NOT layout/requirements.txt's klt pin.

  pdk-smoke:
    # Caller half of the PDK smoke job (#707): the steps live in
    # .github/workflows/pdk-smoke.yml, split out so this workflow's trigger
    # could drop `pull_request: labeled` without losing the on-demand smoke
    # run. Unrelated label writes on a PR (loom:reviewing, loom:pr, ...)
    # no longer re-run this workflow against an unchanged tree, while adding
    # the `run-pdk-smoke` label still starts smoke immediately via
    # pdk-smoke.yml's own `pull_request: labeled` trigger. The gate below is
    # the original smoke job's gate, unchanged: nightly, manual dispatch,
    # and a PR (opened/synchronized/reopened) already carrying the
    # `run-pdk-smoke` label.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'run-pdk-smoke'))
    uses: ./.github/workflows/pdk-smoke.yml
